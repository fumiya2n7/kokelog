<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="こけログ">
<meta name="theme-color" content="#fbfaf7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>こけログ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#24231f;background:#fbfaf7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fbfaf7}main{max-width:620px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 18px calc(42px + env(safe-area-inset-bottom))}
header{text-align:center;margin-bottom:18px}.logo{font-size:38px;line-height:1;margin-bottom:8px}h1{margin:0;font-size:27px}.subtitle{font-size:13px;color:#88847a;margin-top:5px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#ece9e1;border-radius:13px;padding:4px;margin:18px 0}.tab{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:700}.tab.active{background:#fff;box-shadow:0 1px 5px #0001}
.primary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:11px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.action{min-height:82px;border:1px solid #dedbd2;border-radius:18px;background:#fff;font-weight:700;font-size:17px}.action:active,.other:active{transform:scale(.98)}.other{width:100%;padding:13px;border:1px dashed #d2cec3;border-radius:14px;background:transparent;color:#666158;font-weight:600}
.section{margin-top:28px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.count{font-size:12px;color:#99948b}.timeline{border-top:1px solid #e8e5de}.entry{display:grid;grid-template-columns:55px 1fr auto;gap:10px;align-items:start;padding:14px 2px;border-bottom:1px solid #e8e5de}.time{font-size:14px;color:#8c887f;font-variant-numeric:tabular-nums;padding-top:2px}.entryName{font-weight:700}.memo{font-size:14px;color:#656158;margin-top:4px;white-space:pre-wrap;word-break:break-word}.edit{border:0;background:transparent;color:#aaa59b;padding:3px 5px;font-size:18px}.empty{text-align:center;color:#aaa59b;padding:30px 0;font-size:14px}.hint,.graphNote{text-align:center;color:#aaa59b;font-size:12px;margin-top:17px}
#graphView{display:none}.graphCard{background:#fff;border:1px solid #e3e0d8;border-radius:18px;padding:14px 10px 10px}.graphTitle{font-weight:700;padding:2px 6px 10px}.legend{display:flex;gap:14px;padding:8px 8px 2px;font-size:12px;color:#777268;flex-wrap:wrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.wake{background:#444}.sleep{background:#999}.meal{background:#bbb}canvas{width:100%;height:330px;display:block}
dialog{border:0;border-radius:22px;padding:0;width:min(calc(100% - 32px),460px);box-shadow:0 20px 70px #0003}dialog::backdrop{background:#0005}.modal{padding:20px}.modal h2{font-size:19px;margin:0 0 15px}label{display:block;font-size:12px;color:#777268;margin:12px 0 6px}input,textarea{width:100%;border:1px solid #dcd8cf;border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{resize:vertical;min-height:92px}.modalButtons{display:flex;gap:8px;margin-top:16px}.modalButtons button{flex:1;border-radius:12px;padding:12px;border:1px solid #ddd8ce;background:#fff}.modalButtons .save{background:#272620;color:#fff;border-color:#272620}.delete{color:#b34949!important}
.toast{position:fixed;left:50%;bottom:calc(25px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#272620;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><main>
<header><div class="logo">🐓</div><h1>こけログ</h1><div id="date" class="subtitle"></div></header>
<div class="tabs"><button class="tab active" data-view="today">今日</button><button class="tab" data-view="graph">7日間</button></div>
<div id="todayView"><div class="primary"><button class="action" data-log="起床">起床</button><button class="action" data-log="就寝">就寝</button><button class="action" data-log="食事">食事</button></div><button id="otherBtn" class="other">＋ その他</button><section class="section"><div class="sectionHead"><strong>今日の記録</strong><span id="count" class="count"></span></div><div id="timeline" class="timeline"></div><div class="hint">記録をタップするとメモを追加・編集できます</div></section></div>
<div id="graphView"><div class="graphCard"><div class="graphTitle">生活のかたち</div><canvas id="chart"></canvas><div class="legend"><span><i class="dot wake"></i>起床</span><span><i class="dot sleep"></i>就寝</span><span><i class="dot meal"></i>食事</span></div></div><div class="graphNote">直近7日間の記録。評価せず、眺めるだけ。</div></div>
</main>
<dialog id="otherDialog"><div class="modal"><h2>その他を記録</h2><label>項目</label><input id="otherName" placeholder="例：散歩、昼寝、病院"><label>メモ（任意）</label><textarea id="otherMemo" placeholder="必要なときだけ"></textarea><div class="modalButtons"><button data-close="otherDialog">キャンセル</button><button id="saveOther" class="save">記録する</button></div></div></dialog>
<dialog id="editDialog"><div class="modal"><h2 id="editTitle">記録を編集</h2><label>時刻</label><input id="editTime" type="time"><label>メモ（任意）</label><textarea id="editMemo" placeholder="必要なときだけ"></textarea><div class="modalButtons"><button id="deleteEntry" class="delete">削除</button><button data-close="editDialog">キャンセル</button><button id="saveEdit" class="save">保存</button></div></div></dialog><div id="toast" class="toast"></div>
<script>
const STORAGE="kokelog-v02";let logs=JSON.parse(localStorage.getItem(STORAGE)||"[]"),editingId=null;const $=id=>document.getElementById(id);
function localDay(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function localTime(d=new Date()){return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem(STORAGE,JSON.stringify(logs))}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function toast(msg){const e=$("toast");e.textContent=msg;e.classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove("show"),1300)}
function add(name,memo=""){const d=new Date();logs.push({id:uid(),name,memo,time:localTime(d),day:localDay(d),stamp:d.getTime()});save();render();toast(`${name} ${localTime(d)} を記録`)}
function render(){const d=new Date();$("date").textContent=d.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});const today=logs.filter(x=>x.day===localDay()).sort((a,b)=>b.stamp-a.stamp);$("count").textContent=today.length?`${today.length}件`:"";$("timeline").innerHTML=today.length?today.map(x=>`<div class="entry" data-id="${esc(x.id)}"><div class="time">${esc(x.time)}</div><div><div class="entryName">${esc(x.name)}</div>${x.memo?`<div class="memo">${esc(x.memo)}</div>`:""}</div><button class="edit">···</button></div>`).join(""):`<div class="empty">まだ記録はありません</div>`}
document.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>add(b.dataset.log));$("otherBtn").onclick=()=>{$("otherName").value="";$("otherMemo").value="";$("otherDialog").showModal()};$("saveOther").onclick=()=>{const n=$("otherName").value.trim(),m=$("otherMemo").value.trim();if(!n)return $("otherName").focus();add(n,m);$("otherDialog").close()};$("timeline").onclick=e=>{const r=e.target.closest(".entry");if(!r)return;const x=logs.find(v=>v.id===r.dataset.id);if(!x)return;editingId=x.id;$("editTitle").textContent=x.name;$("editTime").value=x.time;$("editMemo").value=x.memo||"";$("editDialog").showModal()};$("saveEdit").onclick=()=>{const x=logs.find(v=>v.id===editingId);if(x){const t=$("editTime").value;if(t){x.time=t;const [y,m,d]=x.day.split("-").map(Number),[hh,mm]=t.split(":").map(Number);x.stamp=new Date(y,m-1,d,hh,mm,0,0).getTime()}x.memo=$("editMemo").value.trim();save();render()}$("editDialog").close();toast("記録を更新")};$("deleteEntry").onclick=()=>{logs=logs.filter(x=>x.id!==editingId);save();render();$("editDialog").close();toast("記録を削除")};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).close());
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===t));const g=t.dataset.view==="graph";$("todayView").style.display=g?"none":"block";$("graphView").style.display=g?"block":"none";if(g)setTimeout(drawChart,30)});
function minutes(time){const [h,m]=time.split(":").map(Number);return h*60+m}
function drawChart(){const c=$("chart"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=330;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext("2d");ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const pad={l:42,r:12,t:15,b:35},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;const days=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);days.push({key:localDay(d),label:`${d.getMonth()+1}/${d.getDate()}`})}ctx.font="11px -apple-system";ctx.textAlign="right";ctx.textBaseline="middle";[0,360,720,1080,1440].forEach(min=>{const y=pad.t+ph*(min/1440);ctx.strokeStyle="#ece9e2";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillStyle="#aaa59b";ctx.fillText(`${String(Math.floor(min/60)%24).padStart(2,"0")}:00`,pad.l-7,y)});ctx.textAlign="center";days.forEach((d,i)=>{const x=pad.l+pw*(i/6);ctx.fillStyle="#8c887f";ctx.fillText(d.label,x,h-13)});
function pts(name){return days.map((d,i)=>{const arr=logs.filter(x=>x.day===d.key&&x.name===name).sort((a,b)=>a.stamp-b.stamp);if(!arr.length)return null;const x=pad.l+pw*(i/6),v=name==="就寝"?arr[arr.length-1]:arr[0];return{x,y:pad.t+ph*(minutes(v.time)/1440)}})}function line(name,color){const p=pts(name);ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();let started=false;p.forEach(q=>{if(!q){started=false;return}if(!started){ctx.moveTo(q.x,q.y);started=true}else ctx.lineTo(q.x,q.y)});ctx.stroke();p.forEach(q=>{if(!q)return;ctx.fillStyle=color;ctx.beginPath();ctx.arc(q.x,q.y,4,0,Math.PI*2);ctx.fill()})}line("起床","#444");line("就寝","#999");days.forEach((d,i)=>logs.filter(x=>x.day===d.key&&x.name==="食事").forEach(v=>{const x=pad.l+pw*(i/6),y=pad.t+ph*(minutes(v.time)/1440);ctx.fillStyle="#bbb";ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}))}
window.addEventListener("resize",()=>{if($("graphView").style.display==="block")drawChart()});if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();
</script></body></html>
